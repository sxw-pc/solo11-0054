version: 1
name: gap-policy
description: Two devices with a wide gap threshold and step resampling.
inputs:
  - id: dev-a1
    path: fixtures/series/dev-a1.csv
    format: csv
    device_id: dev-a1
    metric: temperature
  - id: dev-e5
    path: fixtures/series/dev-e5_gap.csv
    format: csv
    device_id: dev-e5
    metric: temperature
anchors: fixtures/anchor/anchors.yaml
grid:
  origin_us: 1700000000000000
  step_us: 1000000
  end_us: 1700000060000000
max_gap_us: 9000000
monotonic_policy: reject
duplicate_policy: keep_first
conflict_policy: keep_first
clock_skew: constant
resample:
  default: step
gap_report_limit: 10
